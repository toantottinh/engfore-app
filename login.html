<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - EngFore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Đăng nhập vào EngFore</h1>
            <p class="auth-subtitle">Play but Learn</p>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <p id="error-message" class="error-message"></p>
                <button type="submit" class="auth-button">Đăng nhập</button>
            </form>
            <p class="auth-link">Chưa có tài khoản? <a href="/signup.html">Đăng ký</a></p>
        </div>
    </div>

    <script type="module" src="/login.js"></script>
</body>
</html>
