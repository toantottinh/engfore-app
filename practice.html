<div class="practice-container">
    <header class="practice-header">
        <a href="#" id="exit-practice-btn" class="exit-btn">&times; Exit</a>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-text">0/0</span>
    </header>

    <main id="practice-main" class="practice-main">
        <!-- Flashcard View -->
        <div id="flashcard-view" class="practice-view">
            <div id="flashcard" class="flashcard">
                <div class="flashcard-inner">
                    <div id="flashcard-front" class="flashcard-face flashcard-front">
                        <!-- Meaning will be here -->
                    </div>
                    <div id="flashcard-back" class="flashcard-face flashcard-back"></div>
                </div>
            </div>
            <button id="flip-btn" class="btn-primary">Flip</button>
        </div>

        <!-- Typing View -->
        <div id="typing-view" class="practice-view hidden">
            <div class="typing-prompt">
                <p id="typing-meaning" class="typing-meaning"></p>
                <button id="typing-audio-btn" class="audio-btn" title="Listen">🔊</button>
            </div>
            <input type="text" id="typing-input" class="typing-input" placeholder="Type the English word..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div id="hint-area" class="hint-area"></div>
        </div>
    </main>
</div>
