<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - EngFore</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/review.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" role="navigation" aria-label="Main navigation">
            <div class="sidebar-logo"><a href="../index.html" aria-label="EngFore Home">EngFore</a></div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <span class="nav-group-title">Learning</span>
                    <a href="../index.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="layout-dashboard"></i></span><span class="nav-text">Dashboard</span></a>
                    <a href="vocabulary.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="book-marked"></i></span><span class="nav-text">Vocabulary</span></a>
                    <a href="flashcards.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="layers"></i></span><span class="nav-text">Flashcards</span></a>
                    <a href="review.html" class="nav-item active" aria-current="page"><span class="nav-icon"><i class="icon" data-lucide="rotate-ccw"></i></span><span class="nav-text">Review</span></a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-title">Practice</span>
                    <a href="grammar.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="pilcrow"></i></span><span class="nav-text">Grammar</span></a>
                    <a href="reading.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="book-open"></i></span><span class="nav-text">Reading</span></a>
                    <a href="listening.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="headphones"></i></span><span class="nav-text">Listening</span></a>
                    <a href="quiz.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="clipboard-check"></i></span><span class="nav-text">Quiz</span></a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-title">Account</span>
                    <a href="profile.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="user"></i></span><span class="nav-text">Profile</span></a>
                    <a href="login.html" class="nav-item"><span class="nav-icon"><i class="icon" data-lucide="log-out"></i></span><span class="nav-text">Sign Out</span></a>
                </div>
            </nav>
            <div class="sidebar-footer"><p>EngFore v1.0 &mdash; Stop Guessing. Start Typing.</p></div>
        </aside>
        <div class="sidebar-overlay"></div>
        <div class="app-content">
            <header class="topbar" role="banner">
                <div class="topbar-left">
                    <button class="btn-icon-only sidebar-toggle" aria-label="Toggle sidebar menu"><i class="icon" data-lucide="menu"></i></button>
                    <div class="topbar-search"><input type="search" placeholder="Search..." aria-label="Search"></div>
                </div>

                <div class="topbar-right">
                    <div class="topbar-actions">
                        <button class="btn-icon-only" aria-label="Notifications"><i class="icon" data-lucide="bell"></i></button>
                        <button class="btn-icon-only" aria-label="Settings"><i class="icon" data-lucide="settings"></i></button>
                    </div>
                    <div class="topbar-user">
                        <button class="btn-icon-only" aria-label="User menu"><div class="user-avatar" role="img" aria-label="User avatar"></div></button>
                    </div>
                </div>
            </header>
            <main class="main-content" role="main">
                <div class="review-container">
                    <div class="review-stats">
                        <div class="review-stat"><i class="icon" data-lucide="check-circle"></i> Correct: <span class="review-stat-value" id="review-correct">0</span></div>
                        <div class="review-stat"><i class="icon" data-lucide="x-circle"></i> Incorrect: <span class="review-stat-value" id="review-incorrect">0</span></div>
                        <div class="review-stat"><i class="icon" data-lucide="layers"></i> Remaining: <span class="review-stat-value" id="review-remaining">10</span></div>
                    </div>
                    <div class="review-progress">
                        <div class="progress-bar"><div class="progress" id="review-progress" style="width: 0%;"></div></div>
                    </div>
                    <div class="review-prompt">
                        <p class="review-prompt-label" id="review-prompt-label">Translate to English</p>
                        <p class="review-prompt-word" id="review-prompt-word">Làm ngạc nhiên</p>
                    </div>
                    <div class="review-input-group">
                        <input type="text" class="review-input" id="review-input" placeholder="Type your answer..." autofocus aria-label="Type your answer">
                    </div>
                    <div class="review-feedback" id="review-feedback"></div>
                    <div class="review-actions">
                        <button class="btn btn-secondary" id="review-skip-btn">Skip</button>
                        <button class="btn btn-primary" id="review-check-btn">Check</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pages/review.js"></script>
</body>
</html>
