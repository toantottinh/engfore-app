<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary - EngFore</title>

    <!-- CSS Links -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/vocabulary.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" role="navigation" aria-label="Main navigation">
            <div class="sidebar-logo">
                <a href="../index.html" aria-label="EngFore Home">EngFore</a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <span class="nav-group-title">Learning</span>
                    <a href="../index.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="layout-dashboard"></i></span>
                        <span class="nav-text">Dashboard</span>
                    </a>
                    <a href="vocabulary.html" class="nav-item active" aria-current="page">
                        <span class="nav-icon"><i class="icon" data-lucide="book-marked"></i></span>
                        <span class="nav-text">Vocabulary</span>
                    </a>
                    <a href="flashcards.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="layers"></i></span>
                        <span class="nav-text">Flashcards</span>
                    </a>
                    <a href="review.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="rotate-ccw"></i></span>
                        <span class="nav-text">Review</span>
                    </a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-title">Practice</span>
                    <a href="grammar.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="pilcrow"></i></span>
                        <span class="nav-text">Grammar</span>
                    </a>
                    <a href="reading.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="book-open"></i></span>
                        <span class="nav-text">Reading</span>
                    </a>
                    <a href="listening.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="headphones"></i></span>
                        <span class="nav-text">Listening</span>
                    </a>
                    <a href="quiz.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="clipboard-check"></i></span>
                        <span class="nav-text">Quiz</span>
                    </a>
                </div>
                <div class="nav-group">
                    <span class="nav-group-title">Account</span>
                    <a href="profile.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="user"></i></span>
                        <span class="nav-text">Profile</span>
                    </a>
                    <a href="login.html" class="nav-item">
                        <span class="nav-icon"><i class="icon" data-lucide="log-out"></i></span>
                        <span class="nav-text">Sign Out</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>EngFore v1.0 &mdash; Stop Guessing. Start Typing.</p>
            </div>
        </aside>
        <div class="sidebar-overlay"></div>

        <div class="app-content">
            <!-- Topbar -->
            <header class="topbar" role="banner">
                <div class="topbar-left">
                    <button class="btn-icon-only sidebar-toggle" aria-label="Toggle sidebar menu">
                        <i class="icon" data-lucide="menu"></i>
                    </button>
                    <div class="topbar-search">
                        <input type="search" placeholder="Search vocabulary, lessons..." aria-label="Search">
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="topbar-actions">
                        <button class="btn-icon-only" aria-label="Notifications">
                            <i class="icon" data-lucide="bell"></i>
                        </button>
                        <button class="btn-icon-only" aria-label="Settings">
                            <i class="icon" data-lucide="settings"></i>
                        </button>
                    </div>
                    <div class="topbar-user">
                        <button class="btn-icon-only" aria-label="User menu">
                            <div class="user-avatar" role="img" aria-label="User avatar"></div>
                        </button>
                    </div>
                </div>
            </header>

            <main class="main-content">
                <div class="page-header">
                    <h1 class="page-title">My Vocabulary</h1>
                    <div class="page-actions">
                        <button class="btn btn-secondary">Import CSV</button>
                        <button class="btn btn-primary" id="add-word-btn">
                            <i class="icon" data-lucide="plus"></i>
                            <span>Add Word</span>
                        </button>
                    </div>
                </div>

                <div class="filters-bar card">
                    <div class="search-control">
                        <i class="icon" data-lucide="search"></i>
                        <input type="search" id="search-input" class="input" placeholder="Search words...">
                    </div>
                    <div class="filter-controls">
                        <select id="category-filter" class="input">
                            <option value="all">All Categories</option>
                            <!-- Options will be populated by JS -->
                        </select>
                        <select id="difficulty-filter" class="input">
                            <option value="all">All Difficulties</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                        <select id="favorite-filter" class="input">
                            <option value="all">All Words</option>
                            <option value="favorites">Favorites Only</option>
                        </select>
                        <select id="sort-by" class="input">
                            <option value="newest">Sort by Newest</option>
                            <option value="oldest">Sort by Oldest</option>
                            <option value="alphabetical">Sort Alphabetically</option>
                        </select>
                    </div>
                </div>

                <div id="vocabulary-list" class="vocabulary-grid">
                    <!-- Vocabulary cards will be rendered here by JS -->
                </div>

                <div id="empty-state" class="empty-state card" style="display: none;">
                    <i class="icon" data-lucide="folder-search"></i>
                    <h2>No Words Found</h2>
                    <p>Your vocabulary list is empty. Add a new word to get started!</p>
                    <button class="btn btn-primary mt-4" id="empty-add-word-btn">Add Your First Word</button>
                </div>

                <div id="pagination" class="pagination">
                    <!-- Pagination controls will be rendered here by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Word Modal -->
    <div id="word-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card card">
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title">Add New Word</h2>
                <button id="close-modal-btn" class="btn-icon-only btn-secondary"><i class="icon" data-lucide="x"></i></button>
            </div>
            <form id="word-form" class="modal-form">
                <input type="hidden" id="word-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="word" class="form-label">Word</label>
                        <input type="text" id="word" class="input" required>
                    </div>
                    <div class="form-group">
                        <label for="pronunciation" class="form-label">Pronunciation</label>
                        <input type="text" id="pronunciation" class="input">
                    </div>
                </div>
                <div class="form-group">
                    <label for="meaning" class="form-label">Vietnamese Meaning</label>
                    <input type="text" id="meaning" class="input" required>
                </div>
                <div class="form-group">
                    <label for="example" class="form-label">Example Sentence</label>
                    <textarea id="example" class="input" rows="3"></textarea>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="part-of-speech" class="form-label">Part of Speech</label>
                        <select id="part-of-speech" class="input"><option>Noun</option><option>Verb</option><option>Adjective</option><option>Adverb</option><option>Other</option></select>
                    </div>
                    <div class="form-group">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" id="category" class="input">
                    </div>
                    <div class="form-group">
                        <label for="difficulty" class="form-label">Difficulty</label>
                        <select id="difficulty" class="input"><option>Easy</option><option>Medium</option><option>Hard</option></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Word</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/main.js"></script>
    <script src="../js/vocabulary.js"></script>
</body>
</html>
