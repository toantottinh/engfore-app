<div class="vocab-library-container">
    <header class="vocab-library-header">
        <h1>Vocabulary Library</h1>
        <div class="actions">
            <input type="search" placeholder="Search sets..." class="search-input">
            <select id="sort-sets-select" class="sort-select">
                <option value="created_at-desc">Sort: Newest</option>
                <option value="created_at-asc">Sort: Oldest</option>
                <option value="name-asc">Sort: Name (A-Z)</option>
            </select>
            <button class="add-set-btn">+ New Set</button>
        </div>
    </header>
    <div class="vocab-set-list">
        <!-- Các bộ từ vựng sẽ được render ở đây -->
        <p class="empty-state">You don't have any vocabulary sets yet. Click "+ New Set" to create one.</p>
    </div>
</div>
